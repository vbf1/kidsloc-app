name: React app - pull request checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop_react/**'
      - '.github/workflows/react-pr-check.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop_react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop_react/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:rentals
