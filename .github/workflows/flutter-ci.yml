name: Mobile - Flutter checks
on:
  push:
    branches: [main]
    paths: ['mobile/flutter_app/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['mobile/flutter_app/**', '.github/workflows/flutter-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
      - name: Generate Android platform when missing
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org br.com.kidsloc --project-name app --no-pub .
            git checkout -- pubspec.yaml pubspec.lock
          fi
          grep -R --include='build.gradle*' -F 'br.com.kidsloc.app' android/app
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test
      - name: Build Android APK
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://wfwohnssvftegnhwdzmt.supabase.co' }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_CNbcPta61eS3yFkmWukRoQ_3rdGsOhl' }}
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM hardware acceleration is available."
          else
            echo "::warning::KVM is unavailable or inaccessible; Android emulator will use slow software CPU emulation."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi
      - name: Smoke test on Android emulator
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          working-directory: mobile/flutter_app
          script: |
            adb install build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -n br.com.kidsloc.app/.MainActivity
            sleep 10
            test -n "$(adb shell pidof br.com.kidsloc.app)" || { adb logcat -d -s AndroidRuntime:E flutter:E; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: kidsloc-android-debug-apk
          path: mobile/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
