name: Mobile - Flutter checks
on:
  push:
    branches: [main]
    paths: ['mobile/flutter_app/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['mobile/flutter_app/**', '.github/workflows/flutter-ci.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
      - run: flutter pub get
      - name: Temporary formatter diagnostic
        run: |
          dart format lib test
          git diff -- lib/main.dart
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
