name: Supabase migration checks
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-check.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.1.0
      - run: supabase db start
      - run: supabase db reset
      - run: supabase stop
      - name: Start local Supabase services without printing ephemeral credentials
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            grep -viE 'key|secret|password|token' /tmp/supabase-start.log | tail -100
            exit 1
          fi
          echo "Local Supabase services started."
      - name: Run local Auth and onboarding end-to-end checks
        run: |
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=' /tmp/supabase.env | cut -d= -f1
          set -a
          source /tmp/supabase.env
          set +a
          MAILPIT_URL=http://127.0.0.1:54324 node supabase/tests/auth-e2e.mjs
      - run: supabase test db
