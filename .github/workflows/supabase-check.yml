name: Supabase migration checks
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-check.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.1.0
      - name: Start local Supabase database with port fallback
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/supabase-db-start.log"

          for port in $(seq 55432 55532); do
            if ss -H -ltn "sport = :$port" | grep -q .; then
              continue
            fi

            sed -i "/^\\[db\\]/,/^\\[/{s/^port = [0-9][0-9]*$/port = $port/;}" supabase/config.toml
            echo "Trying local Supabase database port $port"

            if supabase db start 2>&1 | tee "$log_file"; then
              exit 0
            fi

            if ! grep -qi "address already in use" "$log_file"; then
              echo "::error::Supabase database startup failed for a reason other than a port collision."
              exit 1
            fi

            echo "Port $port was claimed during startup; trying the next available port."
            supabase stop --no-backup >/dev/null 2>&1 || true
          done

          echo "::error::Could not start the local Supabase database after trying ports 55432-55532."
          exit 1
      - run: supabase db reset
      - run: supabase stop
      - run: supabase start
      - name: Run local Auth and onboarding end-to-end checks
        run: |
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=' /tmp/supabase.env | cut -d= -f1
          set -a
          source /tmp/supabase.env
          set +a
          MAILPIT_URL=http://127.0.0.1:54324 node supabase/tests/auth-e2e.mjs
      - run: supabase test db
