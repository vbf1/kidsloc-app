name: Supabase migration checks
on:
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/invite-company-member/index.ts
      - run: supabase db start
      - run: supabase db reset
