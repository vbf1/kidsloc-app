name: Supabase migration checks
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-check.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.1.0
      - name: Select an available local database port
        run: |
          for port in $(seq 55432 55532); do
            if ! ss -H -ltn "sport = :$port" | grep -q .; then
              sed -i "s/^port = 54322$/port = $port/" supabase/config.toml
              echo "Using local Supabase database port $port"
              exit 0
            fi
          done
          echo "::error::No available database port found in range 55432-55532"
          exit 1
      - run: supabase db start
      - run: supabase db reset
      - run: supabase stop
      - run: supabase start
      - name: Run local Auth and onboarding end-to-end checks
        run: |
          supabase status -o env > /tmp/supabase.env
          grep -E '^(API_URL|ANON_KEY|PUBLISHABLE_KEY)=' /tmp/supabase.env | cut -d= -f1
          set -a
          source /tmp/supabase.env
          set +a
          MAILPIT_URL=http://127.0.0.1:54324 node supabase/tests/auth-e2e.mjs
      - run: supabase test db
