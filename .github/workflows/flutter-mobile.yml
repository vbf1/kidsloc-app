name: Flutter mobile checks

on:
  push:
    branches: [main]
    paths:
      - 'mobile/flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'mobile/flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
