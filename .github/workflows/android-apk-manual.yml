name: Mobile - build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/flutter_app/**'
      - '.github/workflows/android-apk-manual.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - name: Validate Android package and Firebase configuration
        shell: bash
        run: |
          test -s android/app/google-services.json
          grep -q '"project_id"' android/app/google-services.json
          grep -q 'br.com.kidsloc.app' android/app/build.gradle.kts
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter application
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android APK
        run: >-
          flutter build apk --debug
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL || 'https://wfwohnssvftegnhwdzmt.supabase.co' }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_CNbcPta61eS3yFkmWukRoQ_3rdGsOhl' }}
      - name: Verify APK output
        shell: bash
        run: |
          SOURCE_APK=build/app/outputs/flutter-apk/app-debug.apk
          APK=build/app/outputs/flutter-apk/KidsLoc.apk
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$APK"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          stat -c 'APK size: %s bytes' "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: KidsLoc-Android
          path: mobile/flutter_app/build/app/outputs/flutter-apk/KidsLoc.apk
          if-no-files-found: error
          retention-days: 14
