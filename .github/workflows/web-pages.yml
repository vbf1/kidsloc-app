name: Web - test and deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/nextjs_app/**', '.github/workflows/web-pages.yml']
  pull_request:
    paths: ['web/nextjs_app/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/nextjs_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Commit generated lockfile to the pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cp package-lock.json "$RUNNER_TEMP/package-lock.json"
          git -C "$GITHUB_WORKSPACE" fetch origin "$GITHUB_HEAD_REF"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp "$RUNNER_TEMP/package-lock.json" "$GITHUB_WORKSPACE/web/nextjs_app/package-lock.json"
          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add web/nextjs_app/package-lock.json
          if git -C "$GITHUB_WORKSPACE" diff --cached --quiet; then
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE" commit -m "chore(web): commit dependency lockfile"
          git -C "$GITHUB_WORKSPACE" push origin "HEAD:$GITHUB_HEAD_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: web/nextjs_app/package-lock.json
          retention-days: 1
      - name: Audit dependency tree
        run: npm audit --audit-level=low
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH || '/kidsloc-app' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/nextjs_app/out
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
