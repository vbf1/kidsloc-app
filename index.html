<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#218653" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" type="image/webp" href="/kidsloc-app/kidsloc-brand.webp" />
    <link rel="apple-touch-icon" href="/kidsloc-app/kidsloc-brand.webp" />
    <meta name="description" content="KidsLoc App — gestão de locações para sua empresa." />
    <title>KidsLoc App</title>
    <script type="module" crossorigin src="/kidsloc-app/assets/index-Bw-0EXTC.js"></script>
    <link rel="stylesheet" crossorigin href="/kidsloc-app/assets/index-6GIzB0fS.css">
  </head>
  <body>
    <script>
      // Remove the legacy PWA worker/cache that can keep serving an outdated company-selection bundle.
      (() => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations =>
            Promise.all(registrations
              .filter(registration => new URL(registration.scope).pathname.startsWith('/kidsloc-app/'))
              .map(registration => registration.unregister()))
          ).catch(() => undefined);
        }
        if ('caches' in window) {
          caches.keys().then(keys => Promise.all(
            keys.filter(key => key.startsWith('kidsloc-app-')).map(key => caches.delete(key))
          )).catch(() => undefined);
        }
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
