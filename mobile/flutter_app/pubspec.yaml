name: kidsloc_app
description: Gestão de locações para brinquedos e eventos.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.9.1
  go_router: ^15.1.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.8.0
  url_launcher: ^6.3.3
  crypto: ^3.0.8
  firebase_core: ^4.15.1
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^20.1.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  freezed: ^2.5.7
  json_serializable: ^6.9.5
